name: Generate contribution snake

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Generate snake SVGs
        uses: Platane/snk@v3
        with:
          github_user_name: Leonciny
          outputs: |
            dist/github-snake.svg?palette=github&color_snake=#C8A85A&color_dots=#e2dcc7,#b9b5a5,#8d897b,#5f5c51,#171614
            dist/github-snake-dark.svg?palette=github-dark&color_snake=#C8A85A&color_dots=#2a2924,#5f5c51,#8d897b,#b9b5a5,#EAE5D3

      - name: Push SVGs to the output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
